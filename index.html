    <style>
        /* Estilos Generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #FAF8F5;
            --bg-secondary: #F3EFEA;
            --text-main: #333333;
            --text-muted: #666666;
            --accent-gold: #C5A059;
            --accent-soft: #8B7E74;
            --white: #FFFFFF;
            --font-title: 'Cormorant Garamond', serif;
            --font-script: 'Pinyon Script', cursive;
            --font-body: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.6;
        }

        .page-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: var(--bg-primary);
            box-shadow: 0 0 30px rgba(0,0,0,0.05);
            min-height: 100vh;
            position: relative;
        }

        section {
            padding: 60px 25px;
            text-align: center;
            position: relative;
        }

        .divider {
            width: 60px;
            height: 1px;
            background-color: var(--accent-gold);
            margin: 25px auto;
        }

        /* Portada / Header */
        .hero-section {
            padding: 80px 20px 60px 20px;
            background: linear-gradient(180deg, #F5EFE6 0%, var(--bg-primary) 100%);
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-subtitle {
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-soft);
            margin-bottom: 10px;
        }

        .hero-title {
            font-family: var(--font-script);
            font-size: 4.5rem;
            color: var(--accent-gold);
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .hero-phrase {
            font-family: var(--font-title);
            font-style: italic;
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 85%;
            margin: 20px auto;
        }

        .scroll-indicator {
            margin-top: 40px;
            color: var(--accent-gold);
            font-size: 1.2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Foto de la Quinceañera */
        .photo-section {
            padding: 20px 25px;
        }

        .photo-frame {
            width: 100%;
            height: 420px;
            border-radius: 150px 150px 20px 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 8px solid var(--white);
            background-color: #EAE3D9;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
